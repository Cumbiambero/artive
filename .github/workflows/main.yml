name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 */3 * *'  # Every 3 days (Supabase pauses after 7 days of inactivity)
  workflow_dispatch:      # Allow manual trigger from the Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: PROD 
    steps:
      - name: Debug secrets presence
        run: |
          echo "SUPABASE_URL length: ${#URL}"
          echo "API_KEY length: ${#KEY}"
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.API_KEY }}
      - name: Ping Supabase database
        run: |
          curl --fail --show-error --silent \
            "${{ secrets.SUPABASE_URL }}/rest/v1/artworks?select=id&limit=1" \
            -H "apikey: ${{ secrets.API_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.API_KEY }}"
